name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests, build, bundle and privacy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the privacy scan also reads the history
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # the committed derived data, GLB/USDZ manifest and media manifest must match the model files
      - run: npm run check:model
      - run: npm run models:check
      - run: npm run build
      - run: npm run check:bundles
      # generic detectors only: the local denylist is deliberately not part of the repository
      - run: node scripts/privacy/scan.mjs --all

  e2e:
    name: End-to-end (Playwright: desktop Chromium, iPhone and Android emulation)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
